<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fiche projet — V1.16 (Sprint 1)</title>
<style>
:root{
  --brand:#C00000;
  --text:#222;
  --muted:#666;
  --ok:#1BAE70;
  --warn:#F39C12;
  --bad:#E74C3C;
  --border:#e8e8e8;
  --ghost:#9aa3af;
  
  /* Variables pour hauteurs dynamiques */
  --stripH: 34px;
  --tabsH: 44px;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  font-family:Calibri,Arial,sans-serif;
  color:var(--text);
  font-size:13px;
}

/* wrapper */
.wrap{
  max-width:1200px;
  margin:0 auto;
  padding:8px 10px 24px;
}

/* Bloc figé (Sticky Header) */
.sticky-header-group {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  padding: 8px 10px 10px;
  margin: -8px -10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  box-shadow: 0 6px 15px rgba(0,0,0,0.03);
}

/* body weather themes */
body.trend-soleil{background:#fffdf5;}
body.trend-nuages{background:#f7f9ff;}
body.trend-pluie{background:#f5f7fb;}

body.trend-soleil .sticky-header-group { background: #fffdf5; }
body.trend-nuages .sticky-header-group { background: #f7f9ff; }
body.trend-pluie .sticky-header-group { background: #f5f7fb; }


/* Bandeau principal */
.bar{
  background:var(--brand);
  color:#fff;
  border-radius:18px;
  padding:8px 14px;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
  margin-bottom:6px;
  position:relative;
}
.bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.25);
  pointer-events:none;
}
.bar-inner{
  position:relative;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2px 10px;
}
.title{text-align:center}
.title .date{
  font-weight:700;
  font-size:14px;
  letter-spacing:.2px;
  margin-bottom:2px;
}
.title .name{
  font-weight:900;
  font-size:28px;
  line-height:1.1;
  margin:0 auto;
}
.title .meta-line{
  margin-top:2px;
  font-size:13px;
  opacity:.9;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bar .ver{
  position:absolute;
  right:10px;
  top:6px;
  font-size:10px;
  opacity:.85;
  font-weight:700;
}

/* version coin bas droit */
.page-ver{
  position:fixed;
  right:8px;
  bottom:4px;
  font-size:10px;
  color:#999;
}

/* Ghost text */
.ghost{
  color:var(--ghost);
  font-style:italic;
}

/* Toolbar */
.toolbar{
  margin:4px 0 2px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.btn{
  border:none;
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  cursor:pointer;
  background:#C00000;
  color:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.18);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn.secondary{
  background:#e5e7eb;
  color:#111827;
  box-shadow:none;
}
.btn.link{
  background:transparent;
  color:#C00000;
  box-shadow:none;
  padding:0;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.help{
  font-size:11px;
  margin-bottom:4px;
  color:var(--muted);
}

/* Conso ETP : masqué dans la fiche projet */
.charges-block{display:none;}

/* Bloc supports projet */
.support-section {
  margin-top: 6px;
}
.support-section .box{
  padding-bottom:6px;
  border-color: #d1d5db;
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
}
.support-flow{
  margin:2px 0 2px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
}
.support-chip{
  border:none;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  cursor:pointer;
  background:#f3f4ff;
  color:#111827;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow:0 1px 3px rgba(15,23,42,.15);
}
.support-chip.primary{
  background:#ffffff;
  color:#C00000;
  font-weight:600;
  box-shadow:0 2px 6px rgba(15,23,42,.2);
}
.support-chip.secondary{
  background:#fff7ed;
  color:#9a3412;
  font-weight:600;
}
.support-chip:hover{filter:brightness(1.03);}
.support-chip:active{transform:translateY(1px);}
.support-arrow{
  font-size:15px;
  color:#9ca3af;
}

/* Info text */
.info{
  font-size:11px;
  margin-top:4px;
  color:var(--muted);
}

/* Sections */
.section{margin-top:8px;}
.box{
  border:1px solid var(--border);
  border-radius:12px;
  padding:8px 9px;
  background:#fff;
}
.sect{
  font-weight:700;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:3px;
}

/* KV grid */
.kv{
  display:grid;
  grid-template-columns:auto 1fr;
  column-gap:6px;
  row-gap:2px;
  font-size:13px;
}
.kv .k{color:var(--muted);}

/* Dots */
.dot{
  width:9px;
  height:9px;
  border-radius:999px;
  margin-right:4px;
}
.dot.ok{background:var(--ok);}
.dot.warn{background:var(--warn);}
.dot.bad{background:var(--bad);}

/* Statuts empilés */
.status-stack{
  display:flex;
  flex-direction:column;
  gap:2px;
  font-size:12px;
}
.status-item{
  display:flex;
  align-items:center;
  gap:4px;
}

/* Lists */
ul{
  margin:3px 0 0;
  padding-left:18px;
  font-size:13px;
}
ul li{margin-bottom:1px;}

/* Trend badge */
.trend-badge{
  width:30px;
  height:30px;
  border-radius:999px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 2px 6px rgba(15,23,42,.25);
}

/* Trend arrow 3D */
.trend-card-main{
  display:flex;
  gap:6px;
  align-items:center;
}
.trend-arrow-3d{
  width:46px;
  height:26px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  box-shadow:0 6px 12px rgba(0,0,0,.15);
}
.trend-arrow-dir-up::before{content:"⬆️";}
.trend-arrow-dir-flat::before{content:"➡️";}
.trend-arrow-dir-down::before{content:"⬇️";}
.trend-arrow-col-green{background:#e6f6ec;}
.trend-arrow-col-blue{background:#e6f0ff;}
.trend-arrow-col-red{background:#fde7e7;}
.trend-state{
  font-weight:700;
  font-size:13px;
}
.trend-detail{
  font-size:11px;
  color:var(--muted);
}

/* Tendance générale : 3 colonnes */
.tendance-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  align-items:stretch;
  margin-top:6px;
}
.tendance-item{
  border-radius:12px;
  padding:8px 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,250,252,1));
  box-shadow:0 3px 8px rgba(15,23,42,.12);
  border:1px solid rgba(255,255,255,.8);
  text-align:center;
}
.tendance-item .trend-badge{width:44px;height:44px;font-size:22px;margin:0 auto;}

.tendance-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:700;
}
.tendance-status{
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-start;
  justify-content:center;
}
.tendance-status li{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
}

/* État d’avancement */
.progress-wrapper{
  margin-top:4px;
}
.progress-row{
  margin-bottom:6px;
}
.progress-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--muted);
}
.progress-meta strong{
  color:var(--text);
}
.progress-bar-bg{
  width:100%;
  height:8px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:var(--ok);
  transition:width .25s ease-out;
}

/* Grille des listes d’avancement */
.lists-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:6px;
}

/* Planning / Gantt wrapper */
.timeline-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:5px;
  background:#fff;
}
.gantt-wrap{
  overflow:auto;
  border-radius:14px;
  border:1px solid #dde2f1;
  background:#f8f9fc;
  padding:8px;
  position:relative;
  margin-top:3px;
}
canvas#projectGantt{
  display:block;
  background:transparent;
  max-width:100%;
}
.legend{
  margin-top:6px;
  font-size:10px;
  color:#4b5563;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.legend-item{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.legend-color{
  width:13px;
  height:7px;
  border-radius:4px;
  background:#9ca3af;
}
.legend-color.phase1{background:#FFCDD2;}
.legend-color.phase2{background:#FFE0B2;}
.legend-color.phase3{background:#FFF9C4;}
.legend-color.phase4{background:#C8E6C9;}
.legend-color.phase5{background:#BBDEFB;}
.legend-color.phase6{background:#E1BEE7;}

.empty-state{
  font-size:12px;
  color:#4b5563;
  text-align:center;
  padding:6px 4px;
}
.empty-state p{margin:2px 0;}

/* Budget & charges projet */
.bc-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:8px;
  align-items:stretch;
  margin-top:4px;
}
.bc-card{
  border-radius:12px;
  padding:8px 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,250,252,1));
  box-shadow:0 3px 8px rgba(15,23,42,.12);
  border:1px solid rgba(255,255,255,.85);
}
.bc-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:6px;
}
.bc-kpi{
  display:flex;
  align-items:baseline;
  gap:8px;
}
.bc-kpi .value{
  font-weight:900;
  font-size:22px;
  line-height:1;
}
.bc-kpi .unit{
  font-weight:800;
  color:#374151;
}
.bc-note{
  margin-top:6px;
  font-size:11px;
  color:var(--muted);
}
.bc-pills{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:6px;
}
.bc-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 9px;
  border-radius:999px;
  background:#f3f4ff;
  color:#111827;
  font-size:12px;
  box-shadow:0 1px 3px rgba(15,23,42,.12);
}

/* Éditeur Modal */
.editor-backdrop{
  position:fixed; inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.editor-modal{
  width:min(1100px, 92vw);
  max-height:86vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  border:1px solid #e5e7eb;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  padding:16px;
}
.editor-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.editor-sub{
  color:#6b7280;
  font-size:12px;
  margin-top:4px;
}
.editor-foot{
  position:sticky;
  bottom:0;
  background:linear-gradient(180deg, rgba(255,255,255,0), #fff 45%);
  padding-top:12px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:10px;
}
.edit-card{
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:12px 12px 10px;
  margin-top:12px;
  background:linear-gradient(180deg,#ffffff,#fafbff);
}
.edit-card-title{
  font-weight:900;
  letter-spacing:.4px;
  text-transform:uppercase;
  font-size:12px;
  color:#111827;
  padding-bottom:8px;
  border-bottom:1px solid #eef2f7;
  margin-bottom:10px;
}
.edit-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 12px;
}
.edit-row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media (max-width: 980px){
  .edit-row2{ grid-template-columns: 1fr; }
  .edit-grid{ grid-template-columns: 1fr; }
}
.field label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin-bottom:4px;
}
.field input, .field textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:8px 10px;
  font-size:12px;
  outline:none;
  background:#f9fafb;
}
.field textarea{ min-height:70px; resize:vertical; }
.edit-card-budget{ border-left:8px solid #c00000; }
.edit-card-charges{ border-left:8px solid #1f5fbf; }


/* =========================
   CSS D'IMPRESSION STRICTEMENT LIMITÉ À 2 PAGES
========================= */
@page{ size: A4 landscape; margin: 10mm; }

@media print {
  * {
    -webkit-print-color-adjust: exact !important; 
    print-color-adjust: exact !important;
  }
  
  html, body { 
    background: #fff !important; 
    font-size: 11px !important; 
  }

  .sticky-header-group { 
    position: static !important; 
    background: transparent !important; 
    padding: 0 !important; 
    margin: 0 !important; 
    box-shadow: none !important; 
    border: none !important;
  }
  .toolbar, #editor, .help, .page-ver, .no-print, .support-section, .btn, button { 
    display: none !important; 
  }
  .charges-block { display: none !important; }

  .wrap { max-width: none !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
  
  .bar { 
    box-shadow: none !important; 
    background: var(--brand) !important; 
    color: #fff !important; 
    border-radius: 10px !important; 
    padding: 6px 12px !important; 
    margin-bottom: 6px !important; 
  }
  .bar::before { display: none !important; }
  .bar * { color: #fff !important; }
  .title .name { font-size: 20px !important; margin-bottom: 2px !important; }
  .title .date { font-size: 12px !important; }
  .title .meta-line { font-size: 12px !important; }

  .section { margin-top: 6px !important; break-inside: avoid; page-break-inside: avoid; }
  .box { 
    padding: 8px 12px !important; 
    border: 1px solid var(--border) !important; 
    border-radius: 10px !important; 
    background: #fff !important; 
  }
  .sect { font-size: 12px !important; margin-bottom: 4px !important; color: #111 !important; }
  .kv, ul { font-size: 12px !important; line-height: 1.3 !important; }
  ul { margin-top: 2px !important; margin-bottom: 2px !important; padding-left: 16px !important; }
  li { margin-bottom: 2px !important; }
  
  .tendance-grid { gap: 6px !important; margin-top: 4px !important; display: flex !important; }
  .tendance-item { 
    flex: 1; padding: 6px !important; border: 1px solid #e0e0e0 !important; 
    border-radius: 8px !important; background: #fdfdfd !important; 
  }
  .tendance-label { font-size: 11px !important; margin-bottom: 4px !important; }
  .tendance-item .trend-badge { 
    width: 34px !important; height: 34px !important; font-size: 18px !important; 
    margin: 0 auto 4px !important; border: 1px solid #eee !important; 
  }
  .trend-state { font-size: 13px !important; margin-bottom: 2px !important; }
  .trend-detail { font-size: 11px !important; }
  .tendance-status { gap: 2px !important; }
  .tendance-status li {
